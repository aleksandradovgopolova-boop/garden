name: Deploy public site to GitHub Pages

# Builds the WowRepo public surface (public/ -> static HTML via
# scripts/build_site.py) and publishes it to GitHub Pages.
# Publication is a deliberate, human-approved step: this runs only on
# pushes to main (i.e. after a reviewed merge) or manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/build_site.py"
      - "scripts/requirements.txt"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Least-privilege token scopes required by GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes supersede older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -r scripts/requirements.txt
      - name: Validate documentation
        run: python scripts/check_docs.py
      - name: Build site
        run: python scripts/build_site.py --out build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages on first run if it is not configured yet.
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
